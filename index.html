<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS Platform — Task Tracker</title>
  <style>
    :root {
      --c-bg: #f7f7f8;
      --c-surface: #ffffff;
      --c-border: #e2e2e5;
      --c-text: #111118;
      --c-text-subtle: #6b6b7b;
      --c-accent: #3b5bdb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--c-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: var(--c-text);
    }

    #header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--c-surface);
      border-bottom: 1px solid var(--c-border);
      padding: 14px 24px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    #title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    h1 .subtitle {
      font-weight: 400;
      color: var(--c-text-subtle);
      margin-left: 6px;
    }

    #total-stat {
      font-size: 12px;
      color: var(--c-text-subtle);
      font-variant-numeric: tabular-nums;
    }

    #phase-stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
    }

    .phase-stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--c-text-subtle);
    }

    .phase-stat-excluded {
      opacity: 0.5;
      font-style: italic;
    }

    .phase-stat-label {
      font-weight: 600;
      min-width: 54px;
    }

    .phase-stat-count {
      min-width: 32px;
      font-variant-numeric: tabular-nums;
    }

    .phase-stat-bar {
      width: 64px;
      height: 4px;
      background: var(--c-border);
      border-radius: 2px;
      overflow: hidden;
    }

    .phase-stat-fill {
      height: 100%;
      background: var(--c-accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #phase-filter {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--c-border);
      background: transparent;
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--c-text-subtle);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .filter-btn:hover {
      border-color: var(--c-accent);
      color: var(--c-accent);
    }

    .filter-btn.active {
      background: var(--c-accent);
      border-color: var(--c-accent);
      color: #fff;
    }

    #board {
      display: flex;
      gap: 12px;
      padding: 16px 24px 24px;
      overflow-x: auto;
      align-items: flex-start;
      min-height: calc(100vh - 130px);
    }

    .col {
      flex: 0 0 230px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 150px);
    }

    .col[data-status="backlog"]        { border-top: 3px solid #94a3b8; }
    .col[data-status="in-progress"]    { border-top: 3px solid #3b82f6; }
    .col[data-status="committed"]      { border-top: 3px solid #8b5cf6; }
    .col[data-status="pending-review"] { border-top: 3px solid #f59e0b; }
    .col[data-status="done"]           { border-top: 3px solid #22c55e; }
    .col[data-status="blocked"]        { border-top: 3px solid #ef4444; }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--c-text-subtle);
      flex-shrink: 0;
    }

    .col-count {
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
    }

    .card-list {
      padding: 0 8px 12px;
      overflow-y: auto;
      flex: 1;
    }

    .card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 5px;
      padding: 10px 11px;
      margin-bottom: 7px;
      transition: box-shadow 0.12s ease, border-color 0.12s ease;
    }

    .card:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      border-color: #c0c0d0;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
    }

    .id-chip {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: 'SF Mono', Consolas, 'Cascadia Code', monospace;
      color: var(--c-text-subtle);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 1px 5px;
    }

    .phase-chip {
      font-size: 10px;
      font-weight: 600;
      color: var(--c-text-subtle);
      background: var(--c-bg);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 1px 5px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--c-text);
      margin: 0 0 7px;
    }

    .type-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 3px;
      padding: 2px 6px;
    }

    .type-build      { background: #e8f0fe; color: #1a56db; }
    .type-design     { background: #f3e8ff; color: #7e22ce; }
    .type-research   { background: #e6f8f6; color: #0f766e; }
    .type-ops        { background: #f0f0f3; color: #4b4b5e; }
    .type-governance { background: #fff7ed; color: #c2410c; }

    .card-notes {
      font-size: 11px;
      line-height: 1.5;
      color: var(--c-text-subtle);
      margin: 7px 0 0;
      padding-top: 7px;
      border-top: 1px solid var(--c-border);
      display: none;
    }

    .card.expanded .card-notes {
      display: block;
    }

    .expand-indicator {
      font-size: 9px;
      color: var(--c-text-subtle);
      margin-left: auto;
      opacity: 0.6;
      transition: transform 0.2s ease;
    }

    .card.expanded .expand-indicator {
      transform: rotate(180deg);
    }

    .card.has-notes {
      cursor: pointer;
    }

    .empty-col {
      font-size: 11px;
      color: var(--c-border);
      text-align: center;
      padding: 20px 8px;
    }
  </style>
</head>
<body>

<header id="header">
  <div id="title-row">
    <h1>DS Platform <span class="subtitle">Task Tracker</span></h1>
    <span id="total-stat"></span>
  </div>
  <div id="phase-stats"></div>
  <nav id="phase-filter">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="1">Phase 1</button>
    <button class="filter-btn" data-filter="2">Phase 2</button>
    <button class="filter-btn" data-filter="3">Phase 3</button>
    <button class="filter-btn" data-filter="4">Phase 4</button>
    <button class="filter-btn" data-filter="5">Phase 5</button>
    <button class="filter-btn" data-filter="6">Phase 6</button>
    <button class="filter-btn" data-filter="ops">Ops</button>
    <button class="filter-btn" data-filter="governance">Governance</button>
    <button class="filter-btn" data-filter="post-mvp1">Post MVP1</button>
  </nav>
</header>

<main id="board">
  <section class="col" data-status="backlog">
    <div class="col-header">Backlog <span class="col-count">0</span></div>
    <div class="card-list"></div>
  </section>
  <section class="col" data-status="in-progress">
    <div class="col-header">In Progress <span class="col-count">0</span></div>
    <div class="card-list"></div>
  </section>
  <section class="col" data-status="pending-review">
    <div class="col-header">Pending Review <span class="col-count">0</span></div>
    <div class="card-list"></div>
  </section>
  <section class="col" data-status="committed">
    <div class="col-header">Committed <span class="col-count">0</span></div>
    <div class="card-list"></div>
  </section>
  <section class="col" data-status="done">
    <div class="col-header">Done <span class="col-count">0</span></div>
    <div class="card-list"></div>
  </section>
  <section class="col" data-status="blocked">
    <div class="col-header">Blocked <span class="col-count">0</span></div>
    <div class="card-list"></div>
  </section>
</main>

<script>
  var allTasks = [];
  var currentFilter = 'all';

  function getFilteredTasks() {
    if (currentFilter === 'all') return allTasks;
    if (currentFilter === 'ops') return allTasks.filter(function(t) { return !t.phase && t.type !== 'governance'; });
    if (currentFilter === 'governance') return allTasks.filter(function(t) { return t.type === 'governance' && !t.phase; });
    if (currentFilter === 'post-mvp1') return allTasks.filter(function(t) { return t.phase === 'post-mvp1'; });
    return allTasks.filter(function(t) { return t.phase === parseInt(currentFilter); });
  }

  function renderStats() {
    var statsEl = document.getElementById('phase-stats');
    var totalEl = document.getElementById('total-stat');
    // Exclude post-mvp1 and removed tasks from overall count
    var activeTasks = allTasks.filter(function(t) { return t.phase !== 'post-mvp1' && t.status !== 'removed'; });
    var done = activeTasks.filter(function(t) { return t.status === 'done'; }).length;
    var pct  = Math.round((done / activeTasks.length) * 100);
    var d = new Date();
    var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    totalEl.textContent = done + '/' + activeTasks.length + ' tasks (' + pct + '%)  ·  Updated ' + today;

    var groups = [
      { label: 'Phase 1', tasks: allTasks.filter(function(t) { return t.phase === 1 && t.status !== 'removed'; }) },
      { label: 'Phase 2', tasks: allTasks.filter(function(t) { return t.phase === 2 && t.status !== 'removed'; }) },
      { label: 'Phase 3', tasks: allTasks.filter(function(t) { return t.phase === 3 && t.status !== 'removed'; }) },
      { label: 'Phase 4', tasks: allTasks.filter(function(t) { return t.phase === 4 && t.status !== 'removed'; }) },
      { label: 'Phase 5', tasks: allTasks.filter(function(t) { return t.phase === 5 && t.status !== 'removed'; }) },
      { label: 'Phase 6', tasks: allTasks.filter(function(t) { return t.phase === 6 && t.status !== 'removed'; }) },
      { label: 'Ops',     tasks: allTasks.filter(function(t) { return !t.phase && t.type !== 'governance' && t.status !== 'removed'; }) },
      // Lane rule: post-mvp1 > phase 1-6 > governance > ops — must match tracker/build.cjs
      { label: 'Governance', tasks: allTasks.filter(function(t) { return t.type === 'governance' && !t.phase && t.status !== 'removed'; }) },
      { label: 'Post MVP1', tasks: allTasks.filter(function(t) { return t.phase === 'post-mvp1' && t.status !== 'removed'; }), excluded: true },
    ];

    statsEl.innerHTML = '';
    groups.forEach(function(g) {
      if (!g.tasks.length) return;
      var done = g.tasks.filter(function(t) { return t.status === 'done'; }).length;
      var pct  = Math.round((done / g.tasks.length) * 100);
      var div  = document.createElement('div');
      div.className = 'phase-stat' + (g.excluded ? ' phase-stat-excluded' : '');
      div.innerHTML =
        '<span class="phase-stat-label">' + g.label + (g.excluded ? ' *' : '') + '</span>' +
        '<span class="phase-stat-count">' + done + '/' + g.tasks.length + '</span>' +
        '<div class="phase-stat-bar"><div class="phase-stat-fill" style="width:' + pct + '%"></div></div>';
      statsEl.appendChild(div);
    });
  }

  function makeCard(task) {
    var card = document.createElement('div');
    card.className = 'card' + (task.notes ? ' has-notes' : '');
    var phaseLabel = task.phase === 'post-mvp1' ? 'Post MVP1' : (task.phase ? 'P' + task.phase : (task.type === 'governance' ? 'Governance' : 'Ops'));
    var expandIndicator = task.notes ? '<span class="expand-indicator">▼</span>' : '';
    var notes = task.notes
      ? '<p class="card-notes">' + task.notes + '</p>'
      : '';
    card.innerHTML =
      '<div class="card-meta">' +
        '<span class="id-chip">' + task.id + '</span>' +
        '<span class="phase-chip">' + phaseLabel + '</span>' +
        expandIndicator +
      '</div>' +
      '<p class="card-title">' + task.title + '</p>' +
      '<span class="type-badge type-' + task.type + '">' + task.type + '</span>' +
      notes;

    if (task.notes) {
      card.addEventListener('click', function() {
        card.classList.toggle('expanded');
      });
    }

    return card;
  }

  function renderBoard() {
    var tasks = getFilteredTasks();
    var statuses = ['backlog', 'in-progress', 'pending-review', 'committed', 'done', 'blocked'];
    statuses.forEach(function(status) {
      var col      = document.querySelector('.col[data-status="' + status + '"]');
      var list     = col.querySelector('.card-list');
      var countEl  = col.querySelector('.col-count');
      var colTasks = tasks.filter(function(t) { return t.status === status; });
      countEl.textContent = colTasks.length;
      list.innerHTML = '';
      if (colTasks.length === 0) {
        list.innerHTML = '<p class="empty-col">—</p>';
      } else {
        colTasks.forEach(function(t) { list.appendChild(makeCard(t)); });
      }
    });
  }

  document.getElementById('phase-filter').addEventListener('click', function(e) {
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderBoard();
  });

  fetch('tasks.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allTasks = data;
      renderStats();
      renderBoard();
    })
    .catch(function(err) {
      document.getElementById('board').innerHTML =
        '<p style="padding:24px;color:#ef4444">Failed to load tasks.json: ' + err.message + '</p>';
    });
</script>

</body>
</html>
